global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: coupon-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: coupon-scheduler
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9092"]

  - job_name: mysql
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
