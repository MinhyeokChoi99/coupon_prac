name: coupon-prac

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
      MYSQL_ROOT_PASSWORD: coupon-root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-exporter.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
      - --config.my-cnf=
    environment:
      MYSQLD_EXPORTER_PASSWORD: coupon-exporter
    depends_on:
      mysql:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: coupon-admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  k6:
    build:
      context: ./loadtest
    image: coupon-prac-k6:local
    profiles: ["loadtest"]
    environment:
      BASE_URL: ${LOAD_TEST_BASE_URL:-http://host.docker.internal:8080}
      K6_TEST_ID: ${K6_TEST_ID:-coupon-${K6_VERSION:-v1}}
      K6_MAX_RPS: ${K6_MAX_RPS:-2000}
      K6_RAMP_DURATION: ${K6_RAMP_DURATION:-60s}
      K6_PRE_ALLOCATED_VUS: ${K6_PRE_ALLOCATED_VUS:-1000}
      K6_MAX_VUS: ${K6_MAX_VUS:-3000}
      K6_ALLOW_DB_WRITES: ${K6_ALLOW_DB_WRITES:-0}
      K6_DB_DSN: ${K6_DB_DSN:-coupon:coupon@tcp(mysql:3306)/coupon?timeout=5s&readTimeout=30s&writeTimeout=30s}
      K6_MODE: ${K6_MODE:-run}
      K6_RUN_ID: ${K6_RUN_ID:-}
      K6_EVENT_COUNT: ${K6_EVENT_COUNT:-30}
      K6_COUPONS_PER_EVENT: ${K6_COUPONS_PER_EVENT:-500}
      K6_USER_COUNT: ${K6_USER_COUNT:-50000}
      K6_VALID_SECONDS: ${K6_VALID_SECONDS:-3600}
      K6_REQUIRE_SOLD_OUT: ${K6_REQUIRE_SOLD_OUT:-true}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg,max
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    volumes:
      - ./loadtest/k6:/scripts:ro
    command: run -o experimental-prometheus-rw /scripts/${K6_VERSION:-v1}/coupon-issuance-ramp-up.js

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
